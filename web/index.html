<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SprintFlow</title>
  <meta name="description" content="Канбан-трекер спринта с дедлайнами и встроенным Pomodoro-таймером 25/5">
  <meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Навигация">
      <button class="nav-item" data-dest="kanban">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z"/></svg>
        <span>Канбан</span>
      </button>
      <button class="nav-item" data-dest="focus">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v2H9zM12 6a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 8.6V9h-2v6.4l4.2 2.5 1-1.7z"/></svg>
        <span>Фокус</span>
      </button>
    </nav>
    <main id="main" class="main"></main>
  </div>
  <button id="fab" class="fab" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    Задача
  </button>
  <dialog id="dialog"></dialog>
  <script src="app.js"></script>
</body>
</html>
